name: Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PRs and tags
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      releases-created: ${{ steps.release.outputs.releases_created }}
      paths-released: ${{ steps.release.outputs.paths_released }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish ${{ matrix.path }}
    needs: release-please
    if: needs.release-please.outputs.releases-created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.paths-released) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Validate
        run: vp run validate

      - name: Check the npm version
        env:
          REQUIRED_NPM: 11.5.1
        run: |
          current="$(npm --version)"
          oldest="$(printf '%s\n' "$REQUIRED_NPM" "$current" | sort -V | head -n 1)"
          if [ "$oldest" != "$REQUIRED_NPM" ]; then
            echo "npm $current is older than $REQUIRED_NPM, the minimum for trusted publishing" >&2
            exit 1
          fi

      # WHY: the Bun pack resolves `catalog:` and `workspace:`, and only npm
      # exchanges the OIDC token of the trusted publisher.
      - name: Pack
        working-directory: ${{ matrix.path }}
        run: vp pm pack --pack-destination "$RUNNER_TEMP/release"

      - name: Publish to npm
        run: npm publish "$RUNNER_TEMP"/release/*.tgz --access public
