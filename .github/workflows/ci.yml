name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  packages:
    name: Packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          cache-dependency-path: bun.lock
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      # Same command as the publish job in release.yml.
      - name: Validate
        run: vp run validate

  boilerplate:
    name: Boilerplate app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/boilerplate
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          cache-dependency-path: bun.lock
          run-install: false

      - name: Install dependencies
        working-directory: .
        run: vp install --frozen-lockfile

      # The app tasks build @evertondgn/solid-tooling first, so the app uses
      # the compiled package as an application installed from npm would.
      - name: Check
        run: vp run check:ci

      - name: Type check the Node files
        run: vp run typecheck:node

      - name: Find dead code
        run: vp run dead-code

      - name: Run tests with coverage
        run: vp run test:ci

      - name: Run tooling tests
        run: vp run test:tooling

      - name: Build
        run: vp run build

      - name: Run end-to-end tests
        run: vp run test:e2e
