name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every run starts only the jobs its files affect, and a push to main that
  # merges an up-to-date pull request starts none: the pull request run already
  # checked the same tree. Manual runs check everything.
  # docs/development.md#ci has the table.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
      pull-requests: read
    outputs:
      docs: ${{ steps.classify.outputs.docs }}
      packages: ${{ steps.classify.outputs.packages }}
      app: ${{ steps.classify.outputs.app }}
    steps:
      - name: Classify the changed files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          emit() {
            printf 'docs=%s\npackages=%s\napp=%s\n' "$1" "$2" "$3" | tee -a "$GITHUB_OUTPUT"
          }
          # The compare API lists at most this many files.
          max_files=300
          case "$EVENT" in
            pull_request)
              files="$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')"
              ;;
            push)
              read -r base head rest <<< "$(gh api "repos/$REPO/commits/$SHA" --jq '[.parents[].sha] | join(" ")')"
              if [ -n "${head:-}" ] && [ -z "${rest:-}" ]; then
                # With no commit of main missing from the branch, the merge
                # commit has the tree of the branch head.
                behind="$(gh api "repos/$REPO/compare/$base...$head" --jq '.behind_by')"
                passed="$(gh api "repos/$REPO/commits/$head/check-runs?check_name=CI%20required" --jq '[.check_runs[] | select(.conclusion == "success")] | length')"
                if [ "$behind" -eq 0 ] && [ "$passed" -gt 0 ]; then
                  echo "The pull request run of $head already checked this tree."
                  emit false false false
                  exit 0
                fi
              fi
              files="$(gh api "repos/$REPO/compare/$BEFORE...$SHA" --jq '.files[].filename')"
              if [ "$(printf '%s\n' "$files" | wc -l)" -ge "$max_files" ]; then
                emit true true true
                exit 0
              fi
              ;;
            *)
              emit true true true
              exit 0
              ;;
          esac
          docs=false
          packages=false
          app=false
          while IFS= read -r file; do
            case "$file" in
              apps/boilerplate/*) app=true ;;
              *.md | docs/* | LICENSE | .coderabbit.yaml | .github/ISSUE_TEMPLATE/*) docs=true ;;
              *)
                packages=true
                app=true
                ;;
            esac
          done <<< "$files"
          emit "$docs" "$packages" "$app"

  docs:
    name: Docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          cache-dependency-path: bun.lock
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check formatting
        run: vp fmt --check

      # Offline: only links between files of this repository, with anchors.
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline --include-fragments --no-progress README.md
            CONTRIBUTING.md SECURITY.md 'docs/**/*.md' 'packages/*/README.md'
            '.github/**/*.md'
          fail: true

  packages:
    name: Packages
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          cache-dependency-path: bun.lock
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      # Same command as the publish job in release.yml.
      - name: Validate
        run: vp run validate

  # The app suites run in two parallel jobs: the end-to-end tests take about
  # half of the time on their own.
  app:
    name: Boilerplate app
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/boilerplate
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          cache-dependency-path: bun.lock
          run-install: false

      - name: Install dependencies
        working-directory: .
        run: vp install --frozen-lockfile

      # WHY: the app's vite.config.ts imports the compiled presets from dist/,
      # and Vite+ loads it before any task, so no task can build them first.
      - name: Build the packages
        working-directory: .
        run: vp run build

      - name: Check
        run: vp run check:ci

      - name: Type check the Node files
        run: vp run typecheck:node

      - name: Find dead code
        run: vp run dead-code

      - name: Run tests with coverage
        run: vp run test:ci

      - name: Run tooling tests
        run: vp run test:tooling

  app-e2e:
    name: Boilerplate app E2E
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/boilerplate
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          cache-dependency-path: bun.lock
          run-install: false

      - name: Install dependencies
        working-directory: .
        run: vp install --frozen-lockfile

      - name: Build the packages
        working-directory: .
        run: vp run build

      - name: Build
        run: vp run build

      - name: Run end-to-end tests
        run: vp run test:e2e

  # The only check the main ruleset requires. A job skipped by its `if`
  # reports success, so this passes when every job passed or was skipped.
  required:
    name: CI required
    needs: [changes, docs, packages, app, app-e2e]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check the job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "A job this check depends on ended as $result." >&2
                exit 1
                ;;
            esac
          done
