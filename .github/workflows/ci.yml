name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group:
    ci-${{ github.event.pull_request.number || (github.event_name == 'schedule'
    && 'daily') || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every run starts only the jobs its files affect, and a push to main that
  # merges an up-to-date pull request starts none: the pull request run already
  # checked the same tree. Manual runs check everything.
  # docs/development.md#ci has the table.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
      pull-requests: read
    outputs:
      docs: ${{ steps.classify.outputs.docs }}
      packages: ${{ steps.classify.outputs.packages }}
      app: ${{ steps.classify.outputs.app }}
      generator: ${{ steps.classify.outputs.generator }}
      consistency: ${{ steps.classify.outputs.consistency }}
      expected: ${{ steps.classify.outputs.expected }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Classify the changed files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tooling/ci/changes.py

  docs:
    name: Docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache-save: false
          cache: true
          cache-dependency-path: bun.lock
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check formatting
        run: vp fmt --check

      # Offline: only links between files of this repository, with anchors.
      # WHY: the package READMEs are also their npm pages, so they link to the
      # main branch by absolute URL; the remaps check those links against this
      # checkout instead of leaving them out.
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --remap
            '^https://github\.com/everton-dgn/solidjs_base/(blob|tree)/main/
            file://${{ github.workspace }}/' --remap
            '^https://raw\.githubusercontent\.com/everton-dgn/solidjs_base/main/
            file://${{ github.workspace }}/' --offline --include-fragments
            --no-progress README.md AGENTS.md CONTRIBUTING.md SECURITY.md
            'docs/**/*.md' 'packages/*/README.md' 'packages/*/docs/**/*.md'
            'packages/*/skills/**/*.md' '.github/**/*.md'
            'apps/boilerplate/README.md' 'apps/boilerplate/AGENTS.md'
            'apps/boilerplate/docs/**/*.md'
          fail: true

  packages:
    name: Packages
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          cache-dependency-path: bun.lock
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      # The release verification job uses the same package checks.
      - name: Validate
        run: vp run validate

  consistency:
    name: Consistency
    needs: changes
    if: needs.changes.outputs.consistency == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache-save: false
          cache: true
          cache-dependency-path: bun.lock
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run checks
        run: |
          vp run test:consistency
          python3 -B -m unittest discover -s tooling/ci
          ruby tooling/ci/workflows.rb

  generator:
    name: Generator
    needs: changes
    if: needs.changes.outputs.generator == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache-save: false
          cache: true
          cache-dependency-path: bun.lock
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run checks
        run: |
          vp run validate:generator

  scenario:
    name: Generated app (${{ matrix.scenario }})
    needs: changes
    if: needs.changes.outputs.generator == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - bun
          - pnpm
          - npm
          - static-with-seo
          - static-seeded-locales
          - server-without-i18n
          - default-client
          - server-without-theme
          - minimal-client
          - server-without-ui-features
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache-save: false
          cache: true
          cache-dependency-path: bun.lock
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run checks
        run: |
          vp run build
          node packages/create-solid/tooling/scenario.ts "${{ matrix.scenario }}"

  # The app suites run in two parallel jobs: the end-to-end tests take about
  # half of the time on their own.
  app:
    name: Boilerplate app
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/boilerplate
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache-save: false
          cache: true
          cache-dependency-path: bun.lock
          run-install: false

      - name: Install dependencies
        working-directory: .
        run: vp install --frozen-lockfile

      # WHY: the app's vite.config.ts imports the compiled presets from dist/,
      # and Vite+ loads it before any task, so no task can build them first.
      - name: Build the packages
        working-directory: .
        run: >-
          vp run --fail-if-no-match --filter @evertondgn/solid-tooling --filter
          @evertondgn/vite-plugin-solid-icons build

      - name: Check
        run: vp run check:ci

      - name: Type check the Node files
        run: vp run typecheck:node

      - name: Find dead code
        run: vp run dead-code

      - name: Run tests with coverage
        run: vp run test:ci

      - name: Run tooling tests
        run: vp run test:tooling

  app-e2e:
    name: Boilerplate app E2E
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/boilerplate
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache-save: false
          cache: true
          cache-dependency-path: bun.lock
          run-install: false

      - name: Install dependencies
        working-directory: .
        run: vp install --frozen-lockfile

      - name: Build the packages
        working-directory: .
        run: >-
          vp run --fail-if-no-match --filter @evertondgn/solid-tooling --filter
          @evertondgn/vite-plugin-solid-icons build

      - name: Build
        run: vp run build

      - name: Run end-to-end tests
        run: vp run test:e2e

  # WHY: release-please reads the body of a merge commit as one more commit, so
  # the title of a pull request merged with the merge button becomes a changelog
  # entry. This run cannot undo the merge; it fails so the entry is removed
  # before the release. docs/releasing.md#merging-a-pull-request has the command.
  merge-message:
    name: Merge commit body
    if: github.event_name == 'push'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Refuse a merge commit with a body
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          parents="$(gh api "repos/$REPO/commits/$SHA" --jq '.parents | length')"
          body="$(gh api "repos/$REPO/commits/$SHA" --jq '.commit.message | split("\n") | .[1:] | join("\n")')"
          if [ "$parents" -gt 1 ] && [ -n "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            echo "The merge commit $SHA has a body, so release-please reads it as one more commit." >&2
            echo "Remove its entry from the release pull request before merging it." >&2
            exit 1
          fi

  # The ruleset requires this check. Compare each expected leg with its own result.
  required:
    name: CI required
    needs:
      [
        changes,
        docs,
        packages,
        consistency,
        generator,
        scenario,
        app,
        app-e2e,
        merge-message
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check every job in this attempt
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED: ${{ needs.changes.outputs.expected }}
          NEEDS: ${{ toJSON(needs) }}
        run: python3 tooling/ci/required.py
