name: Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Tags and GitHub Releases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      releases-created: ${{ steps.release.outputs.releases_created }}
      paths-released: ${{ steps.release.outputs.paths_released }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  verify:
    name: Verify
    needs: release-please
    if: needs.release-please.outputs.releases-created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          cache-dependency-path: bun.lock
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run checks
        run: |
          vp run validate

  scenario:
    name: Generated app (${{ matrix.scenario }})
    needs: release-please
    if: needs.release-please.outputs.releases-created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - bun
          - pnpm
          - npm
          - static-with-seo
          - server-without-i18n
          - static-seeded-locales
          - default-client
          - server-without-theme
          - minimal-client
          - server-without-ui-features
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache-save: false
          cache: true
          cache-dependency-path: bun.lock
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run checks
        run: |
          vp run build
          node packages/create-solid/tooling/scenario.ts "${{ matrix.scenario }}"

  verified:
    name: Check release jobs
    needs: [release-please, verify, scenario]
    if: always() && needs.release-please.outputs.releases-created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require all installed scenarios
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
        run: node tooling/ci/required.ts

  publish:
    name: Publish ${{ matrix.path }}
    needs: [release-please, verified]
    if: needs.release-please.outputs.releases-created == 'true'
    runs-on: ubuntu-latest
    # Bound the build, pack, registry wait and publication together.
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.paths-released) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      # create-solid needs the full build when it joins the release group.
      - name: Build published packages
        run: vp run build:published

      - name: Check the npm version
        env:
          REQUIRED_NPM: 11.5.1
        run: |
          current="$(npm --version)"
          oldest="$(printf '%s\n' "$REQUIRED_NPM" "$current" | sort -V | head -n 1)"
          if [ "$oldest" != "$REQUIRED_NPM" ]; then
            echo "npm $current is older than $REQUIRED_NPM, the minimum for trusted publishing" >&2
            exit 1
          fi

      # WHY: the Bun pack resolves `catalog:` and `workspace:`, and only npm
      # exchanges the OIDC token of the trusted publisher.
      - name: Pack
        working-directory: ${{ matrix.path }}
        run: vp pm pack --pack-destination "$RUNNER_TEMP/release"

      # WHY: the pack pins each package of this repository to the version of
      # this release, and the matrix publishes the packages in no order. A
      # package published before a package it pins installs nothing until that
      # version reaches npm, or never if its job fails. The wait stops within 10
      # minutes and reports the missing package before the job times out.
      - name: Wait for the pinned packages
        run: |
          node tooling/release/wait-for-pinned-packages.ts "$RUNNER_TEMP"/release/*.tgz

      - name: Publish to npm
        run: npm publish "$RUNNER_TEMP"/release/*.tgz --access public

  # WHY: GitHub holds the CI of a pull request opened with the GITHUB_TOKEN
  # until someone approves it; with the App token the CI starts on its own. The
  # job needs release-please so the tags exist before the next release pull
  # request is computed, and stays apart from it so a failure of the App does
  # not stop the publication.
  release-pull-request:
    name: Release pull request
    needs: release-please
    runs-on: ubuntu-latest
    # WHY: release-please fetches missing file lists through the GitHub API.
    # The 500-commit scan took over three minutes, so the larger search can
    # exceed the previous five-minute limit.
    timeout-minutes: 10
    # WHY: the environment admits only main and the release branches, and the
    # App key belongs in its secrets (docs/releasing.md#one-time-setup). The job
    # deploys nothing, so it creates no deployment.
    environment:
      name: release
      deployment: false
    permissions: {}
    steps:
      - name: Create the App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
